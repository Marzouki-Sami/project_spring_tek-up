# Sample Nginx configuration for the shop. It terminates the public connection and applies the
# request-rate limits, so the application itself does not have to.
#
# Try it locally:   docker compose -f compose.yaml -f deploy/compose.nginx.yaml up --build
#                   then open http://localhost:8080
#
# In production add TLS (listen 443 ssl; certificates), redirect port 80 to it, and uncomment the
# Strict-Transport-Security header below. Keep SESSION_COOKIE_SECURE at its default (true) behind HTTPS and set
# FORWARD_HEADERS=framework on the app so it reads the visitor's address from X-Forwarded-For.

# Counted only for POSTs, so opening the sign-in page is never limited, only trying passwords is.
map $request_method $post_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $post_key          zone=sign_in:10m  rate=6r/m;    # login, register, password reset, 2FA codes
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=12r/m;   # token endpoints of the API
limit_req_zone $binary_remote_addr zone=orders:10m   rate=30r/m;   # placing orders through the API
limit_req_zone $binary_remote_addr zone=general:10m  rate=20r/s;   # everything else
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

upstream shop_app {
    server app:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;          # product image uploads (the app caps one upload at 30 MB)
    limit_conn per_ip 40;
    limit_req zone=general burst=60 nodelay;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    server_tokens off;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # only once HTTPS works

    # Password guessing and account creation.
    location ~ ^/(login|register|forgot-password|reset-password|verify-email|2fa/verify|2fa/setup)$ {
        limit_req zone=sign_in burst=4 nodelay;
        include /etc/nginx/shop-proxy.conf;
    }

    location ~ ^/api/auth/ {
        limit_req zone=api_auth burst=6 nodelay;
        include /etc/nginx/shop-proxy.conf;
    }

    location = /api/orders {
        limit_req zone=orders burst=10 nodelay;
        include /etc/nginx/shop-proxy.conf;
    }

    # Pictures never change under the same name, so browsers and shared caches may keep them.
    location /media/ {
        include /etc/nginx/shop-proxy.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(css|js|webjars)/ {
        include /etc/nginx/shop-proxy.conf;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        include /etc/nginx/shop-proxy.conf;
    }
}