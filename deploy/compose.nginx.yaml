# Adds Nginx in front of the app, with the rate limits from deploy/nginx/shop.conf:
#
#   docker compose -f compose.yaml -f deploy/compose.nginx.yaml up --build      then open http://localhost:8080
services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/shop.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/shop-proxy.conf:ro

  app:
    environment:
      FORWARD_HEADERS: framework      # trust X-Forwarded-* from the proxy in front of the app
      APP_BASE_URL: http://localhost:8080