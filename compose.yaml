# Runs the whole shop: the app, MySQL and a catch-all mail inbox.
#
#   export JWT_SECRET=$(openssl rand -base64 48)      # PowerShell: $env:JWT_SECRET = [Convert]::ToBase64String((1..48 | % { Get-Random -Max 256 }))
#   docker compose up --build
#
# Shop:  http://localhost:8081      Mail inbox: http://localhost:8025
# The sample accounts get random passwords, printed once:  docker compose logs app | grep "Demo account"
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # reachable only from this compose network
      MYSQL_DATABASE: shop
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: mysql,demo
      DB_URL: jdbc:mysql://db:3306/shop
      DB_USERNAME: root
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET first (see the top of this file)}"
      MAIL_ENABLED: "true"
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      APP_BASE_URL: http://localhost:8081
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  db-data: