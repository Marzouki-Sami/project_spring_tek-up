# Production-style database. Connection details come from the environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:}
# Required with a real database: tokens must survive restarts and be signed with a key only you know.
app.jwt.secret=${JWT_SECRET}
