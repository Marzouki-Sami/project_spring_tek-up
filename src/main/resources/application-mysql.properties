# Production-style database. Connection details come from the environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:}
# Required with a real database: tokens must survive restarts and be signed with a key only you know.
app.jwt.secret=${JWT_SECRET}

# Production settings: anything security-relevant is explicit rather than defaulted.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.forward-headers-strategy=framework
# Must be stated: false saves emails (with one-time links) to local files, which is for development only.
app.mail.enabled=${MAIL_ENABLED}
