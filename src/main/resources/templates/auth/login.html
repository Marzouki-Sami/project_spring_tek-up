<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('')}"></nav>
<main class="container">
    <div class="auth-card">
        <h1 class="h4 mb-1">Welcome back</h1>
        <p class="text-secondary mb-4">Sign in to see your account.</p>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="alert alert-danger" role="alert" th:if="${param.error}">Wrong email or password, or the account is temporarily locked after too many attempts.</div>
        <form th:action="@{/login}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="username">Email</label>
                <input class="form-control" id="username" name="username" type="email" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between"><label class="form-label" for="password">Password</label><a class="small" th:href="@{/forgot-password}">Forgot password?</a></div>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
        <p class="text-center text-secondary mt-4 mb-0">New here? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
