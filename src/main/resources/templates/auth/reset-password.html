<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('')}"></nav>
<main class="container">
    <div class="auth-card">
        <h1 class="h4 mb-1">Choose a new password</h1>
        <p class="text-secondary mb-4">Pick something strong that you do not use elsewhere.</p>
        <form th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
            <div class="alert alert-danger" role="alert" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
            <input type="hidden" th:field="*{token}">
            <div class="mb-3">
                <label class="form-label" for="newPassword">New password</label>
                <input class="form-control" id="newPassword" type="password" th:field="*{newPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                <div class="form-text">8 or more characters with upper and lower case letters, a digit and a symbol.</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="confirmPassword">Repeat new password</label>
                <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Change password</button>
        </form>
        <p class="text-center mt-4 mb-0"><a th:href="@{/forgot-password}">Request a new link</a></p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
