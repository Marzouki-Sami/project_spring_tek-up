<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('')}"></nav>
<main class="container">
    <div class="auth-card">
        <h1 class="h4 mb-1">Forgot your password?</h1>
        <p class="text-secondary mb-4">Enter your email address and we will send you a link to choose a new one.</p>
        <form th:action="@{/forgot-password}" th:object="${form}" method="post" novalidate>
            <div class="mb-4">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" th:field="*{email}" th:errorclass="is-invalid" autocomplete="email" autofocus>
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Send reset link</button>
        </form>
        <p class="text-center mt-4 mb-0"><a th:href="@{/login}">Back to sign in</a></p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
