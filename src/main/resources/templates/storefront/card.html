<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<article th:fragment="card(product)" class="product-card">
    <div class="product-art" th:classappend="${product.primaryImage != null} ? 'has-image' : 'art-' + ${product.subcategory.category.id % 6}">
        <img th:if="${product.primaryImage != null}" th:src="${product.primaryImage.thumbUrl}" th:alt="${product.primaryImage.altText != null} ? ${product.primaryImage.altText} : ${product.name}" loading="lazy" width="400" height="300">
        <i class="bi bi-bag-heart" th:unless="${product.primaryImage != null}"></i>
    </div>
    <div class="body">
        <span class="cat" th:text="${product.subcategory.category.title + ' · ' + product.subcategory.title}">Category</span>
        <h3><a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">Product</a></h3>
        <div class="mt-auto d-flex justify-content-between align-items-center">
            <span class="price" th:text="(${product.priceVaries} ? 'From ' : '') + ${#numbers.formatDecimal(product.fromPrice, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</span>
            <span class="badge text-bg-danger stock-badge" th:if="${product.stock == 0}">Sold out</span>
            <span class="badge text-bg-warning stock-badge" th:if="${product.stock > 0 and product.stock <= 5}">Only few left</span>
        </div>
    </div>
</article>
</body>
</html>
