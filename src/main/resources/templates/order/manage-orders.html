<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('orders')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <h1 class="h3 mb-3">Orders</h1>
    <section class="panel p-0">
        <form th:replace="~{fragments/lists :: listbar('/manage/orders', ${query}, ${statuses}, ${sorts}, 'Search by number, customer or city')}"></form>
        <div class="table-scroll">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Status</th><th class="num">Total</th><th></th></tr></thead>
                <tbody>
                    <tr th:if="${page.empty}"><td colspan="6" class="empty">No orders match.</td></tr>
                    <tr th:each="o : ${page.content}">
                        <td th:text="'#' + ${o.id}">#1</td>
                        <td th:text="${#temporals.format(o.createdAt, 'd MMM yyyy HH:mm')}">Date</td>
                        <td th:text="${o.user.fullName}">Customer</td>
                        <td><span class="badge" th:classappend="'text-bg-' + ${o.status.color}" th:text="${o.status.label}">Placed</span></td>
                        <td class="num" th:text="${#numbers.formatDecimal(o.total, 1, 'COMMA', 2, 'POINT')} + ' €'">0</td>
                        <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/manage/orders/{id}(id=${o.id})}">Open</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/lists :: pager(${page}, ${links})}"></div>
    </section></main><footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/manage.js}"></script>
</body>
</html>
