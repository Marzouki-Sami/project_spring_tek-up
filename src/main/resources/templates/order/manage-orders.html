<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('orders')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <h1 class="h3 mb-3">Orders</h1>
    <div class="mb-3">
        <a class="chip" th:classappend="${status == null} ? 'active'" th:href="@{/manage/orders}">All</a>
        <a class="chip" th:each="s : ${statuses}" th:classappend="${s == status} ? 'active'" th:href="@{/manage/orders(status=${s})}" th:text="${s.label}">Status</a>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(orders)}">No orders here.</p>
    <div class="panel p-0 table-responsive" th:unless="${#lists.isEmpty(orders)}">
        <table class="table table-hover mb-0">
            <thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Status</th><th class="num">Total</th><th></th></tr></thead>
            <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="'#' + ${o.id}">#1</td>
                    <td th:text="${#temporals.format(o.createdAt, 'd MMM yyyy HH:mm')}">Date</td>
                    <td th:text="${o.user.fullName}">Customer</td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${o.status.color}" th:text="${o.status.label}">Placed</span></td>
                    <td class="num" th:text="${#numbers.formatDecimal(o.total, 1, 'COMMA', 2, 'POINT')} + ' €'">0</td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/manage/orders/{id}(id=${o.id})}">Open</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
