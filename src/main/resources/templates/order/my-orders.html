<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('My orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('account')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <h1 class="h3 mb-4">My orders</h1>
    <section class="panel p-0">
        <form th:replace="~{fragments/lists :: listbar('/account/orders', ${query}, ${statuses}, ${sorts}, 'Search by order number')}"></form>
        <div class="table-scroll">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Order</th><th>Date</th><th>Status</th><th class="num">Total</th><th></th></tr></thead>
                <tbody>
                    <tr th:if="${page.empty}">
                        <td colspan="5" class="empty">
                            <span th:text="${query.q.empty and query.status.empty} ? 'You have not placed an order yet.' : 'No orders match.'">No orders.</span>
                            <a class="d-block mt-2" th:if="${query.q.empty and query.status.empty}" th:href="@{/products}">Browse the shop</a>
                        </td>
                    </tr>
                    <tr th:each="o : ${page.content}">
                        <td th:text="'#' + ${o.id}">#1</td>
                        <td th:text="${#temporals.format(o.createdAt, 'd MMM yyyy')}">Date</td>
                        <td><span class="badge" th:classappend="'text-bg-' + ${o.status.color}" th:text="${o.status.label}">Placed</span></td>
                        <td class="num" th:text="${#numbers.formatDecimal(o.total, 1, 'COMMA', 2, 'POINT')} + ' €'">0</td>
                        <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/account/orders/{id}(id=${o.id})}">View</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/lists :: pager(${page}, ${links})}"></div>
    </section></main><footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/manage.js}"></script>
</body>
</html>
