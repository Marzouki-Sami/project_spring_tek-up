<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('categories')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Categories</h1>
        <a class="btn btn-primary" href="/categories/new">New category</a>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(categories)}">No categories yet. Create the first one.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(categories)}">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Subcategories</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${categories}">
                    <td><span th:text="${item.title}"></span></td>
                    <td><span th:text="${item.description}"></span></td>
                    <td><span th:text="${#lists.size(item.subcategories)}"></span></td>
                    <td class="text-end actions">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/categories/{id}/edit(id=${item.id})}">Edit</a>
                        <form th:action="@{/categories/{id}/delete(id=${item.id})}" method="post"
                              th:attr="onsubmit=|return confirm('Delete this ')|">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
