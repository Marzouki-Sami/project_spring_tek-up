<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('categories')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Categories</h1>
        <a class="btn btn-primary" href="/manage/categories/new">New category</a>
    </div>
    <section class="panel p-0">
        <form th:replace="~{fragments/lists :: listbar('/manage/categories', ${query}, null, null, 'Search by title or description')}"></form>
        <div class="table-scroll">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Subcategories</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${page.empty}"><td colspan="4" class="empty">No categories match.</td></tr>
                <tr th:each="item : ${page.content}">
                    <td><span th:text="${item.title}"></span></td>
                    <td><span th:text="${item.description}"></span></td>
                    <td><span th:text="${#lists.size(item.subcategories)}"></span></td>
                    <td class="text-end actions">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/manage/categories/{id}/edit(id=${item.id})}">Edit</a>
                        <form th:action="@{/manage/categories/{id}/delete(id=${item.id})}" method="post"
                              data-confirm="Delete this item? This cannot be undone.">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <div th:replace="~{fragments/lists :: pager(${page}, ${links})}"></div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/manage.js}"></script>
</body>
</html>
