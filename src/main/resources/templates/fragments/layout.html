<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Shop'">Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav(active)" class="navbar navbar-expand-md bg-body-tertiary border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/">Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'products'} ? 'active'" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'categories'} ? 'active'" href="/categories">Categories</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'subcategories'} ? 'active'" href="/subcategories">Subcategories</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'suppliers'} ? 'active'" href="/suppliers">Suppliers</a></li>
            </ul>
        </div>
    </div>
</nav>
<div th:fragment="flash" class="container">
    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
</div>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
