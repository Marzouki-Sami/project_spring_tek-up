<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Shop'">Shop</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav(active)" class="navbar navbar-expand-lg site-nav sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-bag-heart-fill"></i> Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'shop'} ? 'active'" th:href="@{/products}">Shop</a></li>
                <li class="nav-item dropdown" sec:authorize="hasRole('MANAGER')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"
                       th:classappend="${#strings.contains('products,categories,subcategories,suppliers,orders,coupons', active)} and ${active != ''} ? 'active'">Manage</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/manage/orders}"><i class="bi bi-receipt"></i> Orders</a></li>
                        <li><a class="dropdown-item" th:href="@{/manage/coupons}"><i class="bi bi-ticket-perforated"></i> Coupons</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/manage/products}"><i class="bi bi-box-seam"></i> Products</a></li>
                        <li><a class="dropdown-item" th:href="@{/manage/categories}"><i class="bi bi-tags"></i> Categories</a></li>
                        <li><a class="dropdown-item" th:href="@{/manage/subcategories}"><i class="bi bi-diagram-3"></i> Subcategories</a></li>
                        <li><a class="dropdown-item" th:href="@{/manage/suppliers}"><i class="bi bi-truck"></i> Suppliers</a></li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${active == 'users'} ? 'active'" th:href="@{/admin/users}">Users</a>
                </li>
            </ul>
            <a class="cart-link me-2" th:href="@{/cart}" aria-label="Shopping cart"><i class="bi bi-cart3"></i><span class="cart-count" th:if="${cartCount > 0}" th:text="${cartCount}">2</span></a>
            <button type="button" class="theme-toggle me-2" data-theme-toggle aria-label="Switch between light and dark mode" title="Switch theme"><i class="bi bi-circle-half"></i></button>
            <div class="d-flex align-items-center gap-2" sec:authorize="!isAuthenticated()">
                <a class="btn btn-link nav-signin" th:href="@{/login}">Sign in</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">Create account</a>
            </div>
            <div class="dropdown" sec:authorize="isAuthenticated()">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i> <span th:text="${currentUserName}">Account</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/account}"><i class="bi bi-person"></i> My account</a></li>
                    <li><a class="dropdown-item" th:href="@{/account/orders}"><i class="bi bi-bag-check"></i> My orders</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button class="dropdown-item" type="submit"><i class="bi bi-box-arrow-right"></i> Sign out</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
<div th:fragment="flash" class="container flash">
    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>
<footer th:fragment="footer" class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span>© Shop. A demo store built with Spring Boot.</span>
        <span><i class="bi bi-shield-lock"></i> Secure sign-in, encrypted passwords</span>
    </div>
</footer>
<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
