<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${heading})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('suppliers')}"></nav>
<main class="container narrow">
    <h1 class="h3 mb-4" th:text="${heading}"></h1>
    <form th:action="${action}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="company">Company</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('company')} ? 'is-invalid'" type="text" id="company" th:field="*{company}">
            <div class="invalid-feedback" th:errors="*{company}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="contactName">Contact person</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('contactName')} ? 'is-invalid'" type="text" id="contactName" th:field="*{contactName}">
            <div class="invalid-feedback" th:errors="*{contactName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" type="email" id="email" th:field="*{email}">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" type="text" id="phone" th:field="*{phone}">
            <div class="invalid-feedback" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" type="text" id="address" th:field="*{address}">
            <div class="invalid-feedback" th:errors="*{address}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="registrationNumber">Registration number</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('registrationNumber')} ? 'is-invalid'" type="text" id="registrationNumber" th:field="*{registrationNumber}">
            <div class="invalid-feedback" th:errors="*{registrationNumber}"></div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
            <label class="form-check-label" for="active">Active</label>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" href="/manage/suppliers">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
