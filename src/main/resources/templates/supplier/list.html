<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Suppliers')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('suppliers')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Suppliers</h1>
        <a class="btn btn-primary" href="/manage/suppliers/new">New supplier</a>
    </div>
    <section class="panel p-0">
        <form th:replace="~{fragments/lists :: listbar('/manage/suppliers', ${query}, ${statuses}, null, 'Search by company, contact or email')}"></form>
        <div class="table-scroll">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Contact</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${page.empty}"><td colspan="6" class="empty">No suppliers match.</td></tr>
                <tr th:each="item : ${page.content}">
                    <td><span th:text="${item.company}"></span></td>
                    <td><span th:text="${item.contactName}"></span></td>
                    <td><span th:text="${item.email}"></span></td>
                    <td><span th:text="${item.phone}"></span></td>
                    <td><span class="badge" th:classappend="${item.active} ? text-bg-success : text-bg-secondary" th:text="${item.active} ? 'Active' : 'Inactive'"></span></td>
                    <td class="text-end actions">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/manage/suppliers/{id}/edit(id=${item.id})}">Edit</a>
                        <form th:action="@{/manage/suppliers/{id}/delete(id=${item.id})}" method="post"
                              data-confirm="Delete this item? This cannot be undone.">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <div th:replace="~{fragments/lists :: pager(${page}, ${links})}"></div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/manage.js}"></script>
</body>
</html>
