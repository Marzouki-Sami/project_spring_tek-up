<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body style="margin:0;padding:24px;background:#f5f6fb;font-family:Arial,Helvetica,sans-serif;color:#24243a;">
<div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e7e8f3;border-radius:12px;padding:28px;">
    <p th:text="${shop}" th:style="'margin:0 0 20px;font-size:20px;font-weight:bold;color:' + ${accent}">Shop</p>
    <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;" th:text="${heading}">Heading</h1>
    <p th:each="p : ${paragraphs}" th:text="${p}" style="margin:0 0 14px;line-height:1.55;white-space:pre-line;">Message</p>
    <table th:if="${section == 'LINES'}" style="width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;">
        <tr th:each="i : ${order.items}">
            <td style="padding:6px 0;border-bottom:1px solid #eee;" th:text="${i.quantity} + ' × ' + ${i.name} + (${i.variantLabel} != null ? ' (' + ${i.variantLabel} + ')' : '')">1 × Item</td>
            <td style="padding:6px 0;border-bottom:1px solid #eee;text-align:right;" th:text="${#numbers.formatDecimal(i.lineTotal, 1, 'COMMA', 2, 'POINT')} + ' €'">0 €</td>
        </tr>
        <tr th:if="${order.discount.signum() > 0}"><td style="padding:6px 0;">Discount</td><td style="padding:6px 0;text-align:right;" th:text="'- ' + ${#numbers.formatDecimal(order.discount, 1, 'COMMA', 2, 'POINT')} + ' €'">0 €</td></tr>
        <tr><td style="padding:8px 0;font-weight:bold;">Total</td><td style="padding:8px 0;text-align:right;font-weight:bold;" th:text="${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')} + ' €'">0 €</td></tr>
    </table>
    <p th:if="${section == 'LINES' or section == 'ADDRESS'}" style="font-size:14px;margin:0 0 14px;">Delivery to <span th:text="${order.fullName} + ', ' + ${order.address} + ', ' + ${order.postalCode} + ' ' + ${order.city} + ', ' + ${order.country}">address</span></p>
    <p th:if="${link != null and buttonLabel != ''}" style="margin:24px 0;"><a th:href="${link}" th:style="'display:inline-block;background:' + ${accent} + ';color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;'" th:text="${buttonLabel}">Open</a></p>
    <p th:if="${support != null}" style="margin:0;font-size:13px;color:#6b6b85;">Questions? Write to <span th:text="${support}">help@shop.test</span>.</p>
    <p style="margin:20px 0 0;font-size:12px;color:#8a8aa5;" th:text="${footer}">You received this email because of activity on your account.</p>
</div>
</body>
</html>
