<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body style="margin:0;padding:24px;background:#f5f6fb;font-family:Arial,Helvetica,sans-serif;color:#24243a;">
<div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e7e8f3;border-radius:12px;padding:28px;">
    <p style="margin:0 0 20px;font-size:20px;font-weight:bold;color:#4f46e5;">Shop</p>
    <p>Hi <span th:text="${name}">there</span>,</p>
    <p>Welcome! Please confirm your email address to finish setting up your account.</p>
    <p style="margin:24px 0;"><a th:href="${link}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;">Confirm email address</a></p>
    <p style="font-size:13px;color:#6b6b85;">The link works for 2 days. If you did not sign up, you can ignore this message.</p>
    <p style="margin:28px 0 0;font-size:12px;color:#8a8aa5;">You received this email because of activity on your Shop account.</p>
</div>
</body>
</html>
