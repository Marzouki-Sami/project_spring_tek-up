<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('')}"></nav>
<main class="container error-page">
    <div class="code">500</div>
    <h1 class="h4 mt-3">Something went wrong</h1>
    <p class="text-secondary">An unexpected error occurred. Please try again in a moment.</p>
    <a class="btn btn-primary" th:href="@{/}">Back to the shop</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
