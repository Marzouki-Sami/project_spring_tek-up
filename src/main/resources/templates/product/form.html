<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${heading})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('products')}"></nav>
<main class="container" style="max-width: 640px">
    <h1 class="h3 mb-4" th:text="${heading}"></h1>
    <form th:action="${action}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="sku">SKU</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'" type="text" id="sku" th:field="*{sku}">
            <div class="invalid-feedback" th:errors="*{sku}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" type="text" id="name" th:field="*{name}">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" id="description" rows="3" th:field="*{description}"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="price">Price</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" type="number" id="price" th:field="*{price}" step="0.01" min="0">
            <div class="invalid-feedback" th:errors="*{price}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="stock">Stock</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'" type="number" id="stock" th:field="*{stock}" step="1" min="0">
            <div class="invalid-feedback" th:errors="*{stock}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="subcategoryId">Subcategory</label>
            <select class="form-select" th:classappend="${#fields.hasErrors('subcategoryId')} ? 'is-invalid'" id="subcategoryId" th:field="*{subcategoryId}">
                <option value="">Choose...</option>
                <option th:each="o : ${subcategories}" th:value="${o.id}" th:text="${o.category.title + ' / ' + o.title}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{subcategoryId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="supplierId">Supplier</label>
            <select class="form-select" th:classappend="${#fields.hasErrors('supplierId')} ? 'is-invalid'" id="supplierId" th:field="*{supplierId}">
                <option value="">None</option>
                <option th:each="o : ${suppliers}" th:value="${o.id}" th:text="${o.company}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{supplierId}"></div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
            <label class="form-check-label" for="active">Visible to customers</label>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" href="/products">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
