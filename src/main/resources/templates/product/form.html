<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${heading})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('products')}"></nav>
<main class="container narrow">
    <h1 class="h3 mb-4" th:text="${heading}"></h1>
    <form th:action="${action}" th:object="${form}" method="post" novalidate>
        <div class="alert alert-danger" role="alert" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        <div class="mb-3">
            <label class="form-label" for="sku">SKU <i class="bi bi-info-circle text-secondary" data-bs-toggle="tooltip" title="The stock-keeping code. It is suggested from the name as you type, and you can change it. Leave it empty to have one made for you."></i></label>
            <input class="form-control" th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'" type="text" id="sku" th:field="*{sku}" data-sku-from="name" placeholder="Made from the name">
            <div class="invalid-feedback" th:errors="*{sku}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" type="text" id="name" th:field="*{name}">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" id="description" rows="3" th:field="*{description}"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="price">Price</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" type="number" id="price" th:field="*{price}" step="0.01" min="0">
            <div class="invalid-feedback" th:errors="*{price}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="productTypeId">Product type</label>
            <select class="form-select" id="productTypeId" th:field="*{productTypeId}">
                <option value="">None (a single item, no sizes or colours)</option>
                <option th:each="t : ${productTypes}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
            <div class="form-text">Products with a type are sold in variants such as size and colour. Changing the type later resets the variants.</div>
        </div>
        <div class="mb-3" th:if="${creating}">
            <label class="form-label" for="stock">Starting stock</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'" type="number" id="stock" th:field="*{stock}" step="1" min="0">
            <div class="invalid-feedback" th:errors="*{stock}"></div>
            <div class="form-text">Only for products without a type. Variants get their stock on the variants page.</div>
        </div>
        <p class="text-secondary" th:unless="${creating}">
            <i class="bi bi-box-seam"></i>
            <a th:if="${existing != null and existing.optioned}" th:href="@{/manage/products/{id}/variants(id=${existing.id})}">Manage variants and stock</a>
            <a th:if="${existing != null and !existing.optioned and existing.defaultVariant != null}" th:href="@{/manage/variants/{id}/stock(id=${existing.defaultVariant.id})}">Adjust stock and see its history</a>
        </p><div class="mb-3">
            <label class="form-label" for="subcategoryId">Subcategory</label>
            <select class="form-select" th:classappend="${#fields.hasErrors('subcategoryId')} ? 'is-invalid'" id="subcategoryId" th:field="*{subcategoryId}">
                <option value="">Choose...</option>
                <option th:each="o : ${subcategories}" th:value="${o.id}" th:text="${o.category.title + ' / ' + o.title}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{subcategoryId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="supplierId">Supplier</label>
            <select class="form-select" th:classappend="${#fields.hasErrors('supplierId')} ? 'is-invalid'" id="supplierId" th:field="*{supplierId}">
                <option value="">None</option>
                <option th:each="o : ${suppliers}" th:value="${o.id}" th:text="${o.company}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{supplierId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="lowStockThreshold">Low stock level <i class="bi bi-info-circle text-secondary" data-bs-toggle="tooltip" title="Managers get an email when a variant drops to this many units or fewer. Leave empty to use the shop default of 5."></i></label>
            <input class="form-control" th:classappend="${#fields.hasErrors('lowStockThreshold')} ? 'is-invalid'" type="number" id="lowStockThreshold" th:field="*{lowStockThreshold}" step="1" min="0" placeholder="5">
            <div class="invalid-feedback" th:errors="*{lowStockThreshold}"></div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
            <label class="form-check-label" for="active">Visible to customers</label>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" href="/manage/products">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/manage.js}"></script>
</body>
</html>
