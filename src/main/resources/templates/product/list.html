<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('products')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Products</h1>
        <a class="btn btn-primary" href="/products/new">New product</a>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(products)}">No products yet. Create a category and a subcategory first.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(products)}">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>SKU</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Supplier</th>
                    <th class="num">Price</th>
                    <th class="num">Stock</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${products}">
                    <td><code th:text="${item.sku}"></code></td>
                    <td><span th:text="${item.name}"></span></td>
                    <td><span th:text="${item.subcategory.category.title + ' / ' + item.subcategory.title}"></span></td>
                    <td><span th:text="${item.supplier != null} ? ${item.supplier.company} : '-'"></span></td>
                    <td class="num"><span th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></span></td>
                    <td class="num"><span th:text="${item.stock}" th:classappend="${item.stock == 0} ? 'text-danger fw-semibold'"></span></td>
                    <td><span class="badge" th:classappend="${item.active} ? text-bg-success : text-bg-secondary" th:text="${item.active} ? 'Active' : 'Hidden'"></span></td>
                    <td class="text-end actions">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/products/{id}/edit(id=${item.id})}">Edit</a>
                        <form th:action="@{/products/{id}/delete(id=${item.id})}" method="post"
                              th:attr="onsubmit=|return confirm('Delete this ')|">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
