<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Product types')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('product-types')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Product types</h1>
        <a class="btn btn-primary" th:href="@{/manage/product-types/new}">New product type</a>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(types)}">No product types yet. A type such as Clothing says its products come in sizes and colours.</p>
    <div class="panel p-0 table-responsive" th:unless="${#lists.isEmpty(types)}">
        <table class="table table-hover mb-0">
            <thead><tr><th>Name</th><th>Options</th><th class="text-end">Actions</th></tr></thead>
            <tbody>
                <tr th:each="t : ${types}">
                    <td th:text="${t.name}">Clothing</td>
                    <td><span class="badge text-bg-light border me-1" th:each="o : ${t.optionTypes}" th:text="${o.name}">Size</span></td>
                    <td class="text-end actions">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/manage/product-types/{id}/edit(id=${t.id})}">Edit</a>
                        <form th:action="@{/manage/product-types/{id}/delete(id=${t.id})}" method="post" data-confirm="Delete this product type?">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
