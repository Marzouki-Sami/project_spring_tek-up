<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${heading})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('product-types')}"></nav>
<main class="container narrow">
    <h1 class="h3 mb-4" th:text="${heading}">Product type</h1>
    <form th:action="${action}" th:object="${form}" method="post" novalidate>
        <div class="alert alert-danger" role="alert" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" placeholder="Clothing">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-4">
            <span class="form-label d-block">Options its products come in</span>
            <p class="text-secondary small" th:if="${#lists.isEmpty(optionTypes)}">Create some <a th:href="@{/manage/options}">options</a> first.</p>
            <div class="form-check" th:each="o : ${optionTypes}">
                <input class="form-check-input" type="checkbox" th:id="'opt' + ${o.id}" th:field="*{optionTypeIds}" th:value="${o.id}">
                <label class="form-check-label" th:for="'opt' + ${o.id}">
                    <span th:text="${o.name}">Size</span>
                    <span class="text-secondary small" th:text="'(' + ${#lists.size(o.values)} + ' values)'">(4 values)</span>
                </label>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/manage/product-types}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
