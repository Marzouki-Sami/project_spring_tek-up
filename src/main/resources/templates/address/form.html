<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${heading})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('account')}"></nav>
<main class="container narrow">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/account/addresses}">My addresses</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${heading}">New address</li>
        </ol>
    </nav>
    <h1 class="h3 mb-4" th:text="${heading}">New address</h1>
    <form class="panel" th:action="${action}" th:object="${form}" method="post" novalidate>
        <div class="alert alert-danger" role="alert" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        <div class="row g-3 mb-3">
            <div class="col-sm-6">
                <label class="form-label" for="label">Name this address</label>
                <input class="form-control" id="label" th:field="*{label}" th:errorclass="is-invalid" placeholder="Home, Office...">
                <div class="invalid-feedback" th:errors="*{label}"></div>
            </div>
        </div>
        <div th:replace="~{fragments/address :: fields}"></div>
        <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" id="defaultAddress" th:field="*{defaultAddress}">
            <label class="form-check-label" for="defaultAddress">Use as my default address</label>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary" type="submit">Save address</button>
            <a class="btn btn-outline-secondary" th:href="@{/account/addresses}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<th:block th:replace="~{fragments/address :: scripts}"></th:block>
</body>
</html>
