<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${heading})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('subcategories')}"></nav>
<main class="container narrow">
    <h1 class="h3 mb-4" th:text="${heading}"></h1>
    <form th:action="${action}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="categoryId">Category</label>
            <select class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'" id="categoryId" th:field="*{categoryId}">
                <option value="">Choose...</option>
                <option th:each="o : ${categories}" th:value="${o.id}" th:text="${o.title}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{categoryId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" type="text" id="title" th:field="*{title}">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" id="description" rows="3" th:field="*{description}"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" href="/manage/subcategories">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
