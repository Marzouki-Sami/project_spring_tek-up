<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Subcategories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('subcategories')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Subcategories</h1>
        <a class="btn btn-primary" href="/subcategories/new">New subcategory</a>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(subcategories)}">No subcategories yet. Create a category first, then add subcategories to it.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(subcategories)}">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${subcategories}">
                    <td><span th:text="${item.title}"></span></td>
                    <td><span th:text="${item.category.title}"></span></td>
                    <td><span th:text="${item.description}"></span></td>
                    <td class="text-end actions">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/subcategories/{id}/edit(id=${item.id})}">Edit</a>
                        <form th:action="@{/subcategories/{id}/delete(id=${item.id})}" method="post"
                              th:attr="onsubmit=|return confirm('Delete this ')|">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
