spring.application.name=shop
server.port=8081

# Development default: in-memory H2 that behaves like MySQL. Nothing to install.
spring.datasource.url=jdbc:h2:mem:shop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only checks that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# Content-hashed asset URLs, so a changed stylesheet is never served stale.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Website session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# API tokens. Leave the secret empty in development (a random key is used); set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

# Lock an account for 15 minutes after 5 wrong passwords in a row.
app.security.max-failed-attempts=5
app.security.lock-duration=15m

# Optional first administrator, created at startup when no such account exists.
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
# API documentation: /api/docs (Swagger UI) and /api/openapi (JSON)
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Email. With MAIL_ENABLED=false (the default) messages are only written to the log.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Shop <no-reply@shop.local>}
app.mail.base-url=${APP_BASE_URL:http://localhost:8081}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
# Load lazy collections in batches instead of one query per row (avoids N+1 on lists).
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Product images: stored on disk (a Docker volume in production), at most 5 MB each.
app.images.dir=${IMAGES_DIR:./data/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
# Map and address search (OpenStreetMap by default). Set enabled=false to hide them.
app.geo.enabled=${GEO_ENABLED:true}
app.geo.url=${GEO_URL:https://nominatim.openstreetmap.org}
app.geo.user-agent=${GEO_USER_AGENT:SpringShop/1.0 (demo shop)}
app.geo.tile-url=${GEO_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}